name: CI

on:
  pull_request:
    branches: [main]
  # A direct push to main previously ran NOTHING — a broken main could sit
  # unnoticed until the next PR happened to open.
  push:
    branches: [main]

# A force-push or rapid PR update shouldn't queue stale runs behind fresh
# ones. Never cancel main's own runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# timeout-minutes on every job: the e2e vitest config allows 420s per test, so
# a wedged download could otherwise burn the runner's 6-hour default.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    # 45, not 30: the video-format matrix adds 17 ffmpeg encodes (16 matrix
    # rows + the portrait clip) plus a full analyze_video round-trip each.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Without yt-dlp every download path short-circuits to "not installed",
      # so the Loom/frame e2e tests would silently prove nothing. That blind
      # spot is why issue #24 shipped. Runner only — the published image is
      # unchanged.
      # Pinned like every other dependency here (npm ci is lockfile-pinned):
      # the tests need *a* working yt-dlp, not the newest one, and an
      # unpinned install would run unreviewed code next to GITHUB_TOKEN.
      - run: pipx install yt-dlp==2026.6.9
      - run: yt-dlp --version
      # The ffmpeg-static LINUX build has no drawtext filter (no libfreetype),
      # so the golden text clips can't render with it. The distro ffmpeg is
      # used for CLIP GENERATION ONLY via GOLDEN_FFMPEG — every production
      # code path under test still runs the bundled binary.
      #
      # Bounded + retried because a GitHub runner's apt mirror does go
      # unreachable: run 32166826435 sat in `apt-get update` for 44 minutes
      # against an unresponsive azure.archive.ubuntu.com and was killed by the
      # JOB timeout, so a mirror outage was indistinguishable from a hung test
      # suite. Per-command `timeout` (not just `timeout-minutes`, which cannot
      # interrupt-and-retry) turns that into a fast, legible failure.
      - name: Install ffmpeg for golden-clip generation
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            if timeout 150 sudo apt-get update               && timeout 210 sudo apt-get install -y --no-install-recommends ffmpeg; then
              ffmpeg -version | head -n 1
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying in 15s"
            sleep 15
          done
          echo "::error::apt-get failed after 3 attempts - the runner's package mirror is unreachable"
          exit 1
      # Whisper CLI for the WHISPER_E2E transcription outcome test (issue #30).
      # whisper-ctranslate2 is the drop-in ctranslate2 CLI (no torch — installs
      # in seconds); pinned for the same reason yt-dlp is. The transcriber's
      # candidate list is [WHISPER_BIN, 'whisper'], hence WHISPER_BIN below.
      - run: pipx install whisper-ctranslate2==0.5.7
      - run: whisper-ctranslate2 --version
      # faster-whisper fetches the CT2 model from HuggingFace on first use
      # (~75MB for tiny); cache it across runs.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: whisper-ct2-tiny-0.5.7
      # tesseract.js fetches eng+por traineddata (~7MB) into the OS tmpdir on
      # first OCR (frame-ocr.ts cachePath); cache it. Bump the key if the
      # tessdata language/source ever changes.
      - uses: actions/cache@v6
        with:
          path: /tmp/mcp-video-analyzer/tessdata
          key: tessdata-eng-v1
      # Clips generated by test/helpers/golden-clips.ts (golden text clips +
      # the 16-row video-format matrix). Each cached file name carries a hash
      # of its full ffmpeg argv, so a recipe change lands on a NEW path and
      # regenerates — a stale cache can never serve the wrong clip, which is
      # why a plain restore key is safe here.
      - uses: actions/cache@v6
        with:
          path: /tmp/mcp-video-analyzer/test-golden
          key: golden-clips-v1
      # Google Chrome is preinstalled on ubuntu-latest; puppeteer-core's
      # channel:'chrome' resolves it. Printed so a missing browser reads as
      # "Chrome absent" instead of as a mysterious zero-frame assertion.
      - run: google-chrome --version
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e
        env:
          GOLDEN_FFMPEG: ffmpeg
          WHISPER_E2E: '1'
          WHISPER_BIN: whisper-ctranslate2
          WHISPER_MODEL: tiny
          # The browser fallback (strategy 3) is the ONLY consumer of
          # puppeteer-core, which v0.9.0 bumped across a major. Every failure
          # inside extractBrowserFrames degrades to [], so without this the
          # major bump ships unverified and a regression looks identical to
          # "no frames". Flag set + Chrome missing = FAIL, same contract as
          # WHISPER_E2E.
          BROWSER_E2E: '1'

  # test:smoke builds and boots the real MCP server + CLI — the closest thing
  # to "does it start for an end user" that runs in seconds. It was manual-only
  # until the #28 post-mortem; anything that cheap belongs on every PR.
  smoke:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:smoke

  # verify-all's fourth leg: pack the tarball, install it in a temp dir, boot
  # the installed server — the only check that catches packaging breakage
  # (files list, bin wiring) before `npm publish` does. It was local-only.
  verify-package:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify-package

  # Windows is a first-class dev platform here (vitest pool:'forks' is
  # REQUIRED on Windows; golden-clips.ts carries Windows-specific drawtext
  # path escaping) yet nothing exercised it in CI. Unit tests only — the
  # bundled ffmpeg-static WINDOWS build has drawtext, so golden-clip
  # generation needs no GOLDEN_FFMPEG. The e2e suite stays ubuntu-only:
  # running it twice would double the network-flake surface and minutes for
  # little extra signal.
  unit-windows:
    runs-on: windows-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      # The video-format matrix on Windows. Frame extraction is a
      # Windows-relevant path (path escaping, pool:'forks') that nothing else
      # exercised. The rest of the e2e suite stays ubuntu-only because it
      # downloads real third-party VIDEOS; this file generates every clip
      # locally with the bundled ffmpeg-static.
      #
      # It is not fully offline, though: analyze_video at detail:'standard'
      # always runs OCR (DETAIL_CONFIGS.standard.includeOcr) and tesseract.js
      # fetches eng+por traineddata (~7MB) from its CDN on a cold cache. That
      # is ONE cacheable request to a stable endpoint, not the per-run
      # third-party video downloads the ubuntu-only rule exists to avoid — so
      # cache it exactly like the e2e job does. TEMP/TMP are pinned because
      # os.tmpdir() follows them, and the cache path has to be deterministic.
      - name: Pin temp dir so the tessdata cache path is deterministic
        shell: pwsh
        run: New-Item -ItemType Directory -Force "${{ github.workspace }}\ci-tmp" | Out-Null
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}\ci-tmp\mcp-video-analyzer\tessdata
          key: tessdata-eng-por-win-v1
      - run: npm run test:formats
        env:
          TEMP: ${{ github.workspace }}\ci-tmp
          TMP: ${{ github.workspace }}\ci-tmp

  # Replicates what Glama CI does on every release: build the Dockerfile from
  # a fresh clone (dist/ is gitignored — the image must compile itself) and
  # prove the container actually works. See CLAUDE.md → Publishing.
  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build image from clean clone
        run: docker build -t mcp-video-analyzer:ci .
      - name: Verify ffmpeg binary inside the image
        run: >
          docker run --rm --entrypoint node mcp-video-analyzer:ci
          -e "const p=require('ffmpeg-static');if(!require('fs').existsSync(p)){console.error('ffmpeg binary missing:',p);process.exit(1)}console.log('ffmpeg ok:',p)"
      # sharp 0.35 dropped its install script, so the libvips binary now comes
      # purely from the @img/* prebuilts in the lockfile, resolved under
      # `npm ci --omit=dev --ignore-scripts`. That is invisible on a dev host
      # (which installs the full tree WITH scripts) and fatal in the image.
      # Without this step the symptom is "the container didn't start"; with it
      # the symptom names the culprit.
      - name: Verify sharp libvips prebuilt inside the image
        run: >
          docker run --rm --entrypoint node mcp-video-analyzer:ci --input-type=module
          -e "import sharp from 'sharp'; const b = await sharp({create:{width:8,height:8,channels:3,background:'#808080'}}).raw().toBuffer(); if (b.length !== 192) { console.error('bad raw length:', b.length); process.exit(1) } console.log('sharp ok:', sharp.versions.vips, b.length)"

      - name: Verify MCP server answers initialize
        run: |
          RESPONSE=$(echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}' | timeout 30 docker run -i --rm mcp-video-analyzer:ci | head -n 1)
          echo "$RESPONSE" | grep -q '"result"' || { echo "No initialize result. Got: $RESPONSE"; exit 1; }
          echo "MCP initialize OK"
