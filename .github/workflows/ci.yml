name: CI

on:
  pull_request:
    branches: [main]
  # A direct push to main previously ran NOTHING — a broken main could sit
  # unnoticed until the next PR happened to open.
  push:
    branches: [main]

# A force-push or rapid PR update shouldn't queue stale runs behind fresh
# ones. Never cancel main's own runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# timeout-minutes on every job: the e2e vitest config allows 420s per test, so
# a wedged download could otherwise burn the runner's 6-hour default.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Without yt-dlp every download path short-circuits to "not installed",
      # so the Loom/frame e2e tests would silently prove nothing. That blind
      # spot is why issue #24 shipped. Runner only — the published image is
      # unchanged.
      # Pinned like every other dependency here (npm ci is lockfile-pinned):
      # the tests need *a* working yt-dlp, not the newest one, and an
      # unpinned install would run unreviewed code next to GITHUB_TOKEN.
      - run: pipx install yt-dlp==2026.6.9
      - run: yt-dlp --version
      # The ffmpeg-static LINUX build has no drawtext filter (no libfreetype),
      # so the golden text clips can't render with it. The distro ffmpeg is
      # used for CLIP GENERATION ONLY via GOLDEN_FFMPEG — every production
      # code path under test still runs the bundled binary.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # Whisper CLI for the WHISPER_E2E transcription outcome test (issue #30).
      # whisper-ctranslate2 is the drop-in ctranslate2 CLI (no torch — installs
      # in seconds); pinned for the same reason yt-dlp is. The transcriber's
      # candidate list is [WHISPER_BIN, 'whisper'], hence WHISPER_BIN below.
      - run: pipx install whisper-ctranslate2==0.5.7
      - run: whisper-ctranslate2 --version
      # faster-whisper fetches the CT2 model from HuggingFace on first use
      # (~75MB for tiny); cache it across runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-ct2-tiny-0.5.7
      # tesseract.js fetches eng.traineddata (~15MB) into the OS tmpdir on
      # first OCR (frame-ocr.ts cachePath); cache it. Bump the key if the
      # tessdata language/source ever changes. Golden clips are deliberately
      # NOT cached — regeneration costs seconds.
      - uses: actions/cache@v4
        with:
          path: /tmp/mcp-video-analyzer/tessdata
          key: tessdata-eng-v1
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e
        env:
          GOLDEN_FFMPEG: ffmpeg
          WHISPER_E2E: '1'
          WHISPER_BIN: whisper-ctranslate2
          WHISPER_MODEL: tiny

  # test:smoke builds and boots the real MCP server + CLI — the closest thing
  # to "does it start for an end user" that runs in seconds. It was manual-only
  # until the #28 post-mortem; anything that cheap belongs on every PR.
  smoke:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:smoke

  # verify-all's fourth leg: pack the tarball, install it in a temp dir, boot
  # the installed server — the only check that catches packaging breakage
  # (files list, bin wiring) before `npm publish` does. It was local-only.
  verify-package:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify-package

  # Windows is a first-class dev platform here (vitest pool:'forks' is
  # REQUIRED on Windows; golden-clips.ts carries Windows-specific drawtext
  # path escaping) yet nothing exercised it in CI. Unit tests only — the
  # bundled ffmpeg-static WINDOWS build has drawtext, so golden-clip
  # generation needs no GOLDEN_FFMPEG. The e2e suite stays ubuntu-only:
  # running it twice would double the network-flake surface and minutes for
  # little extra signal.
  unit-windows:
    runs-on: windows-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test

  # Replicates what Glama CI does on every release: build the Dockerfile from
  # a fresh clone (dist/ is gitignored — the image must compile itself) and
  # prove the container actually works. See CLAUDE.md → Publishing.
  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image from clean clone
        run: docker build -t mcp-video-analyzer:ci .
      - name: Verify ffmpeg binary inside the image
        run: >
          docker run --rm --entrypoint node mcp-video-analyzer:ci
          -e "const p=require('ffmpeg-static');if(!require('fs').existsSync(p)){console.error('ffmpeg binary missing:',p);process.exit(1)}console.log('ffmpeg ok:',p)"
      - name: Verify MCP server answers initialize
        run: |
          RESPONSE=$(echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}' | timeout 30 docker run -i --rm mcp-video-analyzer:ci | head -n 1)
          echo "$RESPONSE" | grep -q '"result"' || { echo "No initialize result. Got: $RESPONSE"; exit 1; }
          echo "MCP initialize OK"
