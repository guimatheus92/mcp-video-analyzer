name: Release

# Publishes to npm when a version tag is pushed, through npm Trusted Publishing
# (OIDC): no npm token is stored anywhere, and the package ships with
# provenance. A local `npm publish` needs an interactive 2FA prompt on every
# release, which an agent shell cannot answer — this job is what makes the
# release train runnable end to end.
#
# The trusted-publisher entry on npmjs.com names THIS FILE (`release.yml`).
# Renaming it breaks publishing until that entry is recreated.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # No `cache: npm`: a cache restored from a PR run must not feed the one
      # job that holds publish rights.
      # 24, not the repo's 22 floor: Trusted Publishing needs npm >= 11.5.1,
      # and Node 22 bundles npm 10.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # A tag pushed without the version bump would otherwise publish whatever
      # package.json says under a release named after something else.
      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      # prepublishOnly runs `npm run check && npm run build` first.
      - run: npm publish
